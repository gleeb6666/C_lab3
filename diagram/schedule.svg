<text x="150" y="322" font-size="13">точка синхронізації: потік чекає std::latch завершення вказаних наборів</text>
<text x="20" y="353" font-size="14" font-weight="bold" xml:space="preserve">Залежності схеми №10:</text>
<text x="20" y="375" font-size="14" xml:space="preserve">  c, g, h — після завершення a;   d, i, k — після завершення b;</text>
<text x="20" y="397" font-size="14" xml:space="preserve">  j — після завершення h і d;   n — після завершення c і i.</text>
<text x="20" y="419" font-size="14" font-weight="bold" xml:space="preserve">Лічильники std::latch (count_down після кожної дії набору):</text>
<text x="20" y="441" font-size="14" xml:space="preserve">  a_done(7) — обнуляється в кінці одиниці 3 (потік 2, дія a7)</text>
<text x="20" y="463" font-size="14" xml:space="preserve">  b_done(9) — обнуляється в кінці одиниці 4 (потоки 3, 4)</text>
<text x="20" y="485" font-size="14" xml:space="preserve">  d_done(8) — обнуляється в кінці одиниці 8 (потоки 3, 4)</text>
<text x="20" y="507" font-size="14" xml:space="preserve">  h_done(9) — обнуляється в кінці одиниці 9 (потік 1, дія h5)</text>
<text x="20" y="529" font-size="14" xml:space="preserve">  i_done(8) — обнуляється в кінці одиниці 12 (потоки 3, 4)</text>
<text x="20" y="551" font-size="14" xml:space="preserve">  c_done(4) — обнуляється в кінці одиниці 13 (потік 1, дія c4)</text>
<text x="20" y="573" font-size="14" font-weight="bold" xml:space="preserve">Від наборів g і k не залежить жодна дія, тому вони заповнюють потоки, поки j і n чекають своїх вхідних даних.</text>
</svg>